vision_hints: >-
  GTA V Roleplay auf dem deutschen Server Narco City.
  Der Spieler spielt einen Polizisten beim NCPD.

  WICHTIG: Bewerte Szenen nach ihrem Unterhaltungswert,
  nicht nur nach Action oder Lautstärke.

  Besonders interessante Ereignisse:
  Lustige und absurde Roleplay-Situationen,
  unerwartete Wendungen, spannende Polizeikontrollen,
  eskalierende Streitgespräche, Festnahmen,
  Verfolgungsjagden, Schießereien, Unfälle,
  überraschende Begegnungen und dramatische Momente.

  FACE CAM:
  Falls eine Facecam sichtbar ist, beachte auffällige
  Reaktionen wie starkes Lachen, sichtbare Überraschung,
  Schock, Frustration oder ungläubiges Kopfschütteln.
  Solche Reaktionen können auf besonders interessante
  Situationen hinweisen.

  DIALOGE:
  Auch ruhige Gespräche können hervorragende Highlights
  sein. Besonders wichtig sind ungewöhnliche Aussagen,
  absurde Ausreden, Konflikte und überraschende Antworten.

  WENIG INTERESSANT:
  Gewöhnliche Streifenfahrten ohne Ereignisse,
  längere Menüs, Ladebildschirme, AFK-Phasen,
  wiederholte Routineaufgaben und ereignislose Fahrten.

  Eine spannende Szene sollte möglichst mit ihrem
  Kontext erhalten bleiben und nicht mitten im
  entscheidenden Gespräch enden.

